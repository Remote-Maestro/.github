name: Claude

# Mentionner @claude dans une issue, une PR ou un commentaire de revue pour solliciter Claude Code.
# Utilise l'abonnement Claude (Pro/Max) via le secret d'org CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
# Sobriété (ADR 0006) : mention explicite par un membre, modèle Sonnet, plafond de tours assez haut pour finir
# une tâche (un run interrompu puis relancé coûte plus cher). Pas de déclenchement sur `assigned` (doublons).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model sonnet --max-turns 20
